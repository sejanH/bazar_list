<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Shopping Cart Icon -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Basket Outline -->
    <path d="M120 160 h272 l-28 160 H148 Z" fill="#ffffff" fill-opacity="0.15" />
    <path d="M96 160 h320" />
    <!-- Handle -->
    <path d="M190 160 C190 100 322 100 322 160" stroke-width="24" />
    <!-- Grid Lines -->
    <line x1="200" y1="190" x2="190" y2="290" stroke-width="16" />
    <line x1="256" y1="190" x2="256" y2="290" stroke-width="16" />
    <line x1="312" y1="190" x2="322" y2="290" stroke-width="16" />
    <line x1="135" y1="230" x2="377" y2="230" stroke-width="16" />
  </g>
  
  <!-- Checkmark Badge on bottom-right -->
  <circle cx="380" cy="380" r="70" fill="#10b981" filter="url(#shadow)" />
  <path d="M345 380 l25 25 45 -45" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
</svg>
