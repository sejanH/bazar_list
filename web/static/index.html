<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazar List - Shopping List Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 12px;
            color: white;
            text-align: center;
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: bold;
        }

        .stat-card .label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .add-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .add-form input,
        .add-form select {
            flex: 1;
            min-width: 150px;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .add-form input:focus,
        .add-form select:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-form button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .add-form button:hover {
            transform: translateY(-2px);
        }

        .search-bar {
            margin-bottom: 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            background: #f0f0ff;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .item:hover {
            background: #f0f0ff;
        }

        .item.completed {
            opacity: 0.6;
        }

        .item.completed .item-name {
            text-decoration: line-through;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #667eea;
            border-radius: 50%;
            cursor: pointer;
            margin-right: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .item.completed .checkbox {
            background: #667eea;
        }

        .item.completed .checkbox::after {
            content: '✓';
            color: white;
            font-size: 14px;
        }

        .item-content {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .item-category {
            font-size: 0.85rem;
            color: #666;
        }

        .item-category::before {
            content: '📁 ';
        }

        .item-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .delete-btn {
            background: #ff6b6b;
            color: white;
        }

        .delete-btn:hover {
            background: #ee5a5a;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            background: #e0e0ff;
            color: #667eea;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            .stats {
                flex-wrap: wrap;
            }

            .add-form {
                flex-direction: column;
            }

            .item {
                flex-wrap: wrap;
            }

            .item-actions {
                width: 100%;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛒 Bazar List</h1>
            <p>Your personal shopping list manager</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="number" id="totalItems">0</div>
                <div class="label">Total</div>
            </div>
            <div class="stat-card">
                <div class="number" id="pendingItems">0</div>
                <div class="label">Pending</div>
            </div>
            <div class="stat-card">
                <div class="number" id="completedItems">0</div>
                <div class="label">Completed</div>
            </div>
        </div>

        <div class="card">
            <form class="add-form" id="addForm">
                <input type="text" id="itemName" placeholder="Enter item name..." required>
                <select id="itemCategory">
                    <option value="">Select category</option>
                    <option value="produce">🥬 Produce</option>
                    <option value="dairy">🥛 Dairy</option>
                    <option value="meat">🥩 Meat</option>
                    <option value="pantry">🥫 Pantry</option>
                    <option value="frozen">❄️ Frozen</option>
                    <option value="bakery">🍞 Bakery</option>
                    <option value="beverages">🥤 Beverages</option>
                    <option value="household">🏠 Household</option>
                    <option value="other">📦 Other</option>
                </select>
                <button type="submit">Add Item</button>
            </form>
        </div>

        <div class="card">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Search items...">
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="pending">Pending</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div class="items-list" id="itemsList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3h18v18H3zM9 9h6M9 13h6M9 17h6"/>
                    </svg>
                    <p>Your shopping list is empty</p>
                    <p style="font-size: 0.9rem; margin-top: 10px;">Add items above to get started!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let currentFilter = 'all';
        let allItems = [];

        // Load items on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadItems();
            loadStats();
        });

        // Add form submission
        document.getElementById('addForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('itemName').value.trim();
            const category = document.getElementById('itemCategory').value;

            if (!name) return;

            try {
                const response = await fetch(`${API_BASE}/items`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, category })
                });

                if (response.ok) {
                    document.getElementById('itemName').value = '';
                    document.getElementById('itemCategory').value = '';
                    loadItems();
                    loadStats();
                }
            } catch (error) {
                console.error('Error adding item:', error);
            }
        });

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.trim();
            if (query) {
                searchItems(query);
            } else {
                loadItems();
            }
        });

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                loadItems();
            });
        });

        // Load all items
        async function loadItems() {
            try {
                const response = await fetch(`${API_BASE}/items`);
                allItems = await response.json();
                displayItems(filterItems(allItems));
            } catch (error) {
                console.error('Error loading items:', error);
            }
        }

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const stats = await response.json();
                document.getElementById('totalItems').textContent = stats.total;
                document.getElementById('pendingItems').textContent = stats.pending;
                document.getElementById('completedItems').textContent = stats.completed;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Search items
        async function searchItems(query) {
            try {
                const response = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
                const items = await response.json();
                displayItems(items);
            } catch (error) {
                console.error('Error searching items:', error);
            }
        }

        // Filter items
        function filterItems(items) {
            switch (currentFilter) {
                case 'pending':
                    return items.filter(item => !item.completed);
                case 'completed':
                    return items.filter(item => item.completed);
                default:
                    return items;
            }
        }

        // Display items
        function displayItems(items) {
            const container = document.getElementById('itemsList');

            if (items.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 3h18v18H3zM9 9h6M9 13h6M9 17h6"/>
                        </svg>
                        <p>No items found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="item ${item.completed ? 'completed' : ''}" data-id="${item.id}">
                    <div class="checkbox" onclick="toggleComplete(${item.id})"></div>
                    <div class="item-content">
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        <div class="item-category">${item.category}</div>
                    </div>
                    <div class="item-actions">
                        <button class="action-btn delete-btn" onclick="deleteItem(${item.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        // Toggle item completion
        async function toggleComplete(id) {
            const item = allItems.find(i => i.id === id);
            if (!item) return;

            try {
                const endpoint = item.completed ? 'pending' : 'complete';
                const response = await fetch(`${API_BASE}/items/${id}/${endpoint}`, {
                    method: 'POST'
                });

                if (response.ok) {
                    loadItems();
                    loadStats();
                }
            } catch (error) {
                console.error('Error toggling item:', error);
            }
        }

        // Delete item
        async function deleteItem(id) {
            if (!confirm('Are you sure you want to delete this item?')) return;

            try {
                const response = await fetch(`${API_BASE}/items/${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    loadItems();
                    loadStats();
                }
            } catch (error) {
                console.error('Error deleting item:', error);
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
